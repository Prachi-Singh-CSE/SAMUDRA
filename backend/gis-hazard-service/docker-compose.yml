services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: jalsetu-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: marine_intel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - jalsetu_pgdata:/var/lib/postgresql/data

volumes:
  jalsetu_pgdata:
